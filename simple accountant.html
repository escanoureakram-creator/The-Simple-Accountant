*{color:#000!important;border-color:#888!important}th,.b{background:#eee!important}#zc{zoom:1!important}}

const M=Object.fromEntries(SCF);
const nm=a=>{a=String(a||"").trim();for(let i=a.length;i>0;i--){const f=M[a.slice(0,i)];if(f)return(i<a.length?"↳ ":"")+f}return""};
const $=q=>document.querySelector(q),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function initG(){const el=$("#gbtn");if(!CLIENT_ID||!el||!window.google)return;

google.accounts.id.renderButton(el,{theme:"filled_black",size:"large"})}
function enter(u){U=u;localStorage.setItem("scf_user",JSON.stringify(u));load();cur=null;R()}
function out(){U=null;cur=null;localStorage.removeItem("scf_user");R()}
function exportBackup(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `SCF_Backup_${td()}.json`;
  a.click();
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      S = JSON.parse(evt.target.result);
      save();
      R();
      alert("تم استرجاع النسخة الاحتياطية بنجاح!");
    } catch(err) {
      alert("ملف غير صالح.");
    }
  };
  reader.readAsText(file);
}
const C=()=>S.clients.find(x=>x.id==cur);
const ents=c=>c.entries.filter(e=>(!F.from||e.date>=F.from)&&(!F.to||e.date<=F.to)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
function led(c){const m={};ents(c).forEach((e,i)=>e.lines.forEach(l=>{const a=m[l.acc]??={d:0,c:0,r:[]};a.d+=+l.d||0;a.c+=+l.c||0;a.r.push({date:e.date,n:i+1,t:e.note,d:+l.d||0,c:+l.c||0})}));return m}
function R(){const r=$("#root");if(!U)return r.innerHTML=`<div class="card center"><h1 style="color:var(--gold)">محاسبة SCF</h1><p class="mut">للطلبة والأساتذة · المدونة المحاسبية الجزائرية</p><div id="gbtn" style="display:flex;justify-content:center;margin:16px 0">${CLIENT_ID?"":'<span class="mut">أضف Google Client ID في أعلى الكود لتفعيل زر Google</span>'}</div><button class="pri" onclick="enter({id:'guest',name:'زائر'})">الدخول كزائر</button></div>`,window.G&&initG();
const top=`<div class="top noprint"><h1>محاسبة SCF</h1><span class="date">${fd(td())}</span><div><button onclick="exportBackup()">📥 تصدير نسختك</button> <label class="button" style="cursor:pointer;border:1px solid #444;padding:7px 10px;border-radius:6px;background:#000">📤 استرجاع <input type="file" accept=".json" onchange="importBackup(event)" style="display:none"></label> <span>${U.pic?`<img src="${U.pic}" width="26" style="border-radius:50%;vertical-align:middle"> `:""}${esc(U.name)} <button onclick="out()">خروج</button></span></div></div>`;
r.innerHTML=top+"<main>"+(cur==null?clients():file())+"</main>"}
function clients(){const n=S.clients.length;return`<div class="card"><h2 style="color:var(--gold)">إنشاء ملف زبون <span class="mut">(${n} / 50)</span></h2><div class="bar"><input id="cn" placeholder="اسم الزبون"><input id="cr" placeholder="رقم السجل التجاري"><input id="cd" type="date" value="${td()}"><button class="pri" onclick="addC()">إنشاء الملف</button></div><p class="mut">تاريخ اليوم: ${fd(td())}</p></div><div class="grid">${S.clients.map(c=>`<div class="card"><b>${esc(c.name)}</b><br><span class="mut">السجل: ${esc(c.rc)}<br>أُنشئ: ${fd(c.date)}<br>${c.entries.length} قيد</span><div class="bar" style="margin:10px 0 0"><button class="pri" onclick="cur=${c.id};T='j';R()">فتح</button><button onclick="delC(${c.id})">حذف</button></div></div>`).join("")}</div>`}
function addC(){if(S.clients.length>=50)return alert("بلغت الحد الأقصى: 50 ملفاً.");const n=$("#cn").value.trim();if(!n)return alert("أدخل اسم الزبون.");S.clients.push({id:Date.now(),name:n,rc:$("#cr").value.trim(),date:$("#cd").value||td(),entries:[]});save();R()}
function delC(id){if(confirm("حذف هذا الملف نهائياً؟")){S.clients=S.clients.filter(c=>c.id!=id);save();R()}}
const TABS=[["j","دفتر اليومية"],["g","دفتر الأستاذ"],["t","حسابات T (الترصيد)"],["b","ميزان المراجعة"],["bl","الميزانية"],["cn","ن.ح حسب الطبيعة"],["cf","ن.ح حسب الوظيفة"],["s","مسح فاتورة"]];
function file(){const c=C(),fn={j:jr,g:gl,t:ta,b:tb,bl:bil,cn:cpn,cf:cpf,s:sc}[T];
return`<div class="card noprint"><div class="bar"><button onclick="cur=null;R()">← الملفات</button><h2>${esc(c.name)} <span class="mut">· السجل ${esc(c.rc)} · أُنشئ ${fd(c.date)}</span></h2><span class="date">اليوم: ${fd(td())}</span></div><div class="tabs">${TABS.map(([k,l])=>`<button class="${k==T?"on":""}" onclick="T='${k}';R()">${l}</button>`).join("")}</div></div>
<div class="win"><div class="phead"><h2>${esc(c.name)} — ${esc(c.rc)}</h2>${fd(td())}</div><div class="bar noprint"><h2>${TABS.find(x=>x[0]==T)[1]}</h2><span class="mut">من</span><input type="date" value="${F.from}" onchange="F.from=this.value;R()"><span class="mut">إلى</span><input type="date" value="${F.to}" onchange="F.to=this.value;R()"><button class="ic" title="تصغير" onclick="zm(-.1)">−</button><button class="ic" title="تكبير" onclick="zm(.1)">+</button><button class="ic" title="طباعة" onclick="print()">🖨</button></div><div id="zc" style="zoom:${Z[T]||1}">${fn(c)}</div></div>`}
function zm(d){Z[T]=Math.min(2,Math.max(.5,(Z[T]||1)+d));$("#zc").style.zoom=Z[T]}
const row=()=>`<tr><td><input class="a" list="dl" oninput="this.closest('tr').querySelector('.n').textContent=nm(this.value)" placeholder="رقم الحساب"></td><td class="n mut"></td><td><input class="d" type="number" min="0" step="0.01"></td><td><input class="c" type="number" min="0" step="0.01"></td></tr>`;
function jr(c){const es=ents(c).slice().reverse();return`<div class="card noprint"><div class="bar"><b>قيد جديد</b><input id="ed" type="date" value="${td()}"></div><table><thead><tr><th>رقم الحساب</th><th>البيان (اسم الحساب حسب SCF)</th><th>مدين</th><th>دائن</th></tr></thead><tbody id="ls">${row()+row()}</tbody></table><textarea id="en" rows="2" style="width:100%" placeholder="بيان التسجيل المحاسبي"></textarea><div class="bar" style="margin-top:8px"><button onclick="$('#ls').insertAdjacentHTML('beforeend',row())">+ سطر</button><button class="pri" onclick="val()">تسجيل القيد وقفله</button></div></div>`+(es.map(e=>`<div class="card"><div class="bar"><b>قيد رقم ${c.entries.indexOf(e)+1}</b><span class="mut">${fd(e.date)}</span><span>🔒</span></div><table><tr><th>الحساب</th><th>البيان</th><th>مدين</th><th>دائن</th></tr>${e.lines.map(l=>`<tr><td>${esc(l.acc)}</td><td>${esc(nm(l.acc))}</td><td class="num">${l.d?fm(l.d):""}</td><td class="num">${l.c?fm(l.c):""}</td></tr>`).join("")}</table><textarea id="n${e.id}" rows="2" style="width:100%" disabled>${esc(e.note)}</textarea><div class="bar noprint" style="margin-top:6px"><button id="b${e.id}" onclick="edN(${e.id})">تعديل البيان</button><button onclick="delE(${e.id})">حذف القيد</button></div></div>`).join("")||'<p class="mut">لا توجد قيود بعد.</p>')}
function val(){const L=[...document.querySelectorAll("#ls tr")].map(r=>({acc:r.querySelector(".a").value.trim(),d:+r.querySelector(".d").value||0,c:+r.querySelector(".c").value||0})).filter(l=>l.acc&&(l.d||l.c));
if(L.length<2)return alert("أدخل سطرين على الأقل.");const bad=L.find(l=>!nm(l.acc));if(bad)return alert("الحساب "+bad.acc+" غير موجود في مدونة SCF.");
const D=L.reduce((s,l)=>s+l.d,0),K=L.reduce((s,l)=>s+l.c,0);if(Math.abs(D-K)>.005)return alert("القيد غير متوازن: المدين "+fm(D)+" ≠ الدائن "+fm(K));
C().entries.push({id:Date.now(),date:$("#ed").value||td(),lines:L,note:$("#en").value.trim(),locked:true});save();R()}
function edN(id){const t=$("#n"+id),b=$("#b"+id);if(t.disabled){t.disabled=false;t.focus();b.textContent="حفظ البيان"}else{C().entries.find(e=>e.id==id).note=t.value;save();t.disabled=true;b.textContent="تعديل البيان"}}
function delE(id){if(confirm("حذف القيد؟")){const c=C();c.entries=c.entries.filter(e=>e.id!=id);save();R()}}
function gl(c){const m=led(c),k=Object.keys(m).sort();return k.map(a=>{let b=0;return`<h3 style="color:var(--gold)">${a} — ${esc(nm(a))}</h3><table><tr><th>التاريخ</th><th>قيد</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr>${m[a].r.map(r=>(b+=r.d-r.c,`<tr><td>${r.date.split("-").reverse().join("/")}</td><td>${r.n}</td><td>${esc(r.t)}</td><td class="num">${r.d?fm(r.d):""}</td><td class="num">${r.c?fm(r.c):""}</td><td class="num">${fm(Math.abs(b))} ${b>=0?"م":"د"}</td></tr>`)).join("")}</table>`}).join("")||'<p class="mut">لا توجد عمليات.</p>'}
function ta(c){const m=led(c),k=Object.keys(m).sort();return`<div class="grid">${k.map(a=>{const x=m[a],s=x.d-x.c,tot=Math.max(x.d,x.c);return`<div class="t"><h4>${a} ${esc(nm(a))}</h4><div class="cols"><div><b>مدين</b>${x.r.filter(r=>r.d).map(r=>`<div class="num">${r.date.slice(5).split("-").reverse().join("/")} · ${fm(r.d)}</div>`).join("")}${s<0?`<div class="num ko">رصيد ${fm(-s)}</div>`:""}</div><div><b>دائن</b>${x.r.filter(r=>r.c).map(r=>`<div class="num">${r.date.slice(5).split("-").reverse().join("/")} · ${fm(r.c)}</div>`).join("")}${s>0?`<div class="num ko">رصيد ${fm(s)}</div>`:""}</div></div><div class="cols b num"><div>${fm(tot)}</div><div>${fm(tot)}</div></div><div class="${s?"":"ok"}">${s>0?"رصيد مدين: "+fm(s):s<0?"رصيد دائن: "+fm(-s):"مسوّى"}</div></div>`}).join("")||'<p class="mut">لا توجد عمليات.</p>'}</div>`}
function tb(c){const m=led(c);let a=0,b=0,e=0,f=0;const r=Object.keys(m).sort().map(k=>{const x=m[k],s=x.d-x.c,sd=s>0?s:0,sc=s<0?-s:0;a+=x.d;b+=x.c;e+=sd;f+=sc;return`<tr><td>${k}</td><td>${esc(nm(k))}</td><td class="num">${fm(x.d)}</td><td class="num">${fm(x.c)}</td><td class="num">${sd?fm(sd):""}</td><td class="num">${sc?fm(sc):""}</td></tr>`}).join("");
return`<table><tr><th rowspan="2">الحساب</th><th rowspan="2">البيان</th><th colspan="2">المجاميع</th><th colspan="2">الأرصدة</th></tr><tr><th>مدين</th><th>دائن</th><th>مدين</th><th>دائن</th></tr>${r}<tr class="b"><td colspan="2">المجموع</td><td class="num">${fm(a)}</td><td class="num">${fm(b)}</td><td class="num">${fm(e)}</td><td class="num">${fm(f)}</td></tr></table><p class="${Math.abs(a-b)<.005&&Math.abs(e-f)<.005?"ok":"ko"}">${Math.abs(a-b)<.005&&Math.abs(e-f)<.005?"✓ الميزان متوازن":"✗ الميزان غير متوازن"}</p>`}
function SM(c,p,mode){const m=led(c);let t=0;for(const k in m){if(!p.some(x=>k.startsWith(x)))continue;const s=m[k].d-m[k].c;t+=mode=="D"?Math.max(s,0):mode=="C"?Math.max(-s,0):mode=="A"?s:-s}return t}
